<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Khalid Alharbi — Communicative Objects</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
    }

    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
    }

    .overlay {
      position: fixed;
      z-index: 10;
      pointer-events: none;
    }

    .header {
      top: 32px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 500;
      margin-bottom: 4px;
      color: #ffffff;
    }

    .header .subtitle {
      font-size: 1.125rem;
      color: rgba(255, 255, 255, 0.5);
      margin-bottom: 12px;
    }

    .header .hint {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.3);
    }

    .tooltip {
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 1rem;
      font-weight: 500;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      opacity: 0;
      transition: opacity 0.3s ease;
      white-space: nowrap;
    }

    .tooltip.visible {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="overlay header">
    <h1>Khalid Alharbi</h1>
    <p class="subtitle">Communicative Objects</p>
    <p class="hint">Drag to rotate · Scroll to zoom · Click to open project</p>
  </div>

  <div id="tooltip" class="overlay tooltip"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ─── YOUR PROJECTS ─────────────────────────────────────────
    const projects = [
      {
        title: "Dotted Self Portrait",
        imageUrl: "images/dotted-self-portrait.jpg",
        projectUrl: "dotted-self-portrait/editor.html",
      },
      {
        title: "Dual Portraits",
        imageUrl: "images/dual-portraits.jpg",
        projectUrl: "dual-portraits/index.html",
      },
      {
        title: "Squares Landscape",
        imageUrl: "images/squares-landscape.jpg",
        projectUrl: "squares-landscape/index.html",
      },
      {
        title: "Brooklyn ZIP Noise Map",
        imageUrl: "images/noise-map.jpg",
        projectUrl: "noise-map/index.html",
      },
      {
        title: "Ambient Turing Machine",
        imageUrl: "images/ambient-turing-machine.jpg",
        projectUrl: "ambient-turing-machine/web/index.html",
      },
      {
        title: "Void Machine",
        imageUrl: "images/void-machine.jpg",
        projectUrl: "void-machine/index.html",
      },
      {
        title: "Matrix Panel",
        imageUrl: "images/matrix-panel.jpg",
        projectUrl: "matrix-panel/index.html",
      },
    ];

    // ─── SHADERS ────────────────────────────────────────────────
    const vertexShader = `
      varying vec2 vUv;
      varying float vDistance;
      void main() {
        vUv = uv;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        vDistance = -mvPosition.z;
        gl_Position = projectionMatrix * mvPosition;
      }
    `;

    const fragmentShader = `
      uniform sampler2D uTexture;
      uniform float uHovered;
      uniform float uTime;
      varying vec2 vUv;
      varying float vDistance;
      void main() {
        vec4 texColor = texture2D(uTexture, vUv);
        float alpha = texColor.a * smoothstep(80.0, 30.0, vDistance);

        vec3 glowColor = vec3(1.0, 1.0, 1.0);

        // Circular soft edge
        vec2 center = vUv - 0.5;
        float dist = length(center);
        float circle = smoothstep(0.5, 0.48, dist);

        // Outer glow ring — visible when hovered
        float glowRing = smoothstep(0.55, 0.5, dist) * smoothstep(0.44, 0.48, dist);
        float glowPulse = 0.7 + 0.3 * sin(uTime * 3.0);
        float outerGlow = smoothstep(0.6, 0.48, dist) * (1.0 - smoothstep(0.48, 0.42, dist));

        // Brighten image on hover
        vec3 finalColor = texColor.rgb * (1.0 + uHovered * 0.3);

        // Add glow ring
        finalColor += glowColor * uHovered * glowRing * glowPulse * 3.0;

        // Add soft outer bloom
        finalColor += glowColor * uHovered * outerGlow * glowPulse * 1.5;

        // Overall glow tint
        finalColor += glowColor * uHovered * 0.08;

        float finalAlpha = alpha * circle + uHovered * outerGlow * glowPulse * 0.6;

        gl_FragColor = vec4(finalColor, finalAlpha);
      }
    `;

    // ─── SCENE SETUP ────────────────────────────────────────────
    const container = document.getElementById('canvas-container');
    const tooltip = document.getElementById('tooltip');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050508);
    scene.fog = new THREE.FogExp2(0x050508, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 22;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 8;
    controls.maxDistance = 40;
    controls.enablePan = false;

    scene.add(new THREE.AmbientLight(0xffffff, 0.3));
    const pointLight = new THREE.PointLight(0xffffff, 0.8);
    pointLight.position.set(10, 10, 10);
    scene.add(pointLight);

    // ─── BACKGROUND PARTICLES ───────────────────────────────────
    const particleCount = 1500;
    const particleGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const sizes = new Float32Array(particleCount);

    for (let i = 0; i < particleCount; i++) {
      const r = 15 + Math.random() * 50;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);

      positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i * 3 + 2] = r * Math.cos(phi);

      sizes[i] = Math.random() * 2 + 0.5;
    }

    particleGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

    const particleMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uColor: { value: new THREE.Color(0xffffff) },
      },
      vertexShader: `
        attribute float size;
        varying float vAlpha;
        uniform float uTime;
        void main() {
          vec3 pos = position;
          pos.x += sin(uTime * 0.1 + position.y * 0.5) * 0.3;
          pos.y += cos(uTime * 0.08 + position.z * 0.5) * 0.3;

          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          float dist = -mvPosition.z;
          vAlpha = smoothstep(60.0, 10.0, dist) * 0.6;
          gl_PointSize = size * (150.0 / dist);
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        varying float vAlpha;
        void main() {
          float d = length(gl_PointCoord - 0.5);
          if (d > 0.5) discard;
          float alpha = smoothstep(0.5, 0.1, d) * vAlpha;
          gl_FragColor = vec4(uColor, alpha);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // ─── ORBITAL RINGS ──────────────────────────────────────────
    const ringGeometry = new THREE.RingGeometry(7.8, 8.0, 128);
    const ringMaterial = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.06,
      side: THREE.DoubleSide,
    });
    const ring = new THREE.Mesh(ringGeometry, ringMaterial);
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);

    const ring2 = new THREE.Mesh(ringGeometry.clone(), ringMaterial.clone());
    ring2.rotation.x = Math.PI / 3;
    ring2.rotation.z = Math.PI / 4;
    ring2.material.opacity = 0.03;
    scene.add(ring2);

    // ─── CONSTELLATION LINES ────────────────────────────────────
    const linesMaterial = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.04,
    });

    // ─── CREATE PROJECT MESHES ──────────────────────────────────
    const textureLoader = new THREE.TextureLoader();
    const meshes = [];
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredIndex = null;

    const sphereRadius = 7;

    projects.forEach((project, index) => {
      const texture = textureLoader.load(project.imageUrl);
      texture.minFilter = THREE.LinearFilter;

      const geometry = new THREE.CircleGeometry(1.5, 64);
      const material = new THREE.ShaderMaterial({
        uniforms: {
          uTexture: { value: texture },
          uHovered: { value: 0 },
          uTime: { value: 0 },
        },
        vertexShader,
        fragmentShader,
        transparent: true,
        side: THREE.DoubleSide,
      });

      const mesh = new THREE.Mesh(geometry, material);

      const phi = Math.acos(2 * (index / projects.length) - 1);
      const theta = Math.sqrt(projects.length * Math.PI) * phi;

      const target = {
        x: sphereRadius * Math.cos(theta) * Math.sin(phi),
        y: sphereRadius * Math.sin(theta) * Math.sin(phi),
        z: sphereRadius * Math.cos(phi),
      };

      mesh.userData = { index, projectUrl: project.projectUrl, target, ready: false };
      mesh.position.set(0, 0, 0);
      mesh.scale.set(0, 0, 0);

      scene.add(mesh);
      meshes.push(mesh);

      mesh.userData.entrance = {
        startTime: performance.now() + index * 120,
        duration: 2000,
        target,
      };
      mesh.userData.hoverProgress = 0;
      mesh.userData.targetHover = 0;
    });

    // Draw constellation lines between adjacent projects
    for (let i = 0; i < projects.length; i++) {
      const next = (i + 1) % projects.length;
      const points = [
        new THREE.Vector3(meshes[i].userData.target.x, meshes[i].userData.target.y, meshes[i].userData.target.z),
        new THREE.Vector3(meshes[next].userData.target.x, meshes[next].userData.target.y, meshes[next].userData.target.z),
      ];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      scene.add(new THREE.Line(lineGeo, linesMaterial));
    }

    // ─── EASING HELPERS ─────────────────────────────────────────
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeOutElastic(t) {
      if (t === 0 || t === 1) return t;
      return Math.pow(2, -10 * t) * Math.sin((t - 0.1) * 5 * Math.PI) + 1;
    }
    function lerp(a, b, t) { return a + (b - a) * t; }

    // ─── ANIMATION LOOP ─────────────────────────────────────────
    function animate(now) {
      requestAnimationFrame(animate);
      const time = now * 0.001;

      particles.rotation.y = time * 0.02;
      particles.rotation.x = Math.sin(time * 0.01) * 0.1;
      particleMaterial.uniforms.uTime.value = time;

      ring.rotation.z = time * 0.03;
      ring2.rotation.y = time * 0.02;

      meshes.forEach((mesh, i) => {
        const ud = mesh.userData;
        const mat = mesh.material;

        // Entrance animation
        if (!ud.ready) {
          const elapsed = now - ud.entrance.startTime;
          if (elapsed < 0) return;
          const t = Math.min(elapsed / ud.entrance.duration, 1);
          const posT = easeOutCubic(t);
          const scaleT = easeOutElastic(t);

          mesh.position.set(
            ud.entrance.target.x * posT,
            ud.entrance.target.y * posT,
            ud.entrance.target.z * posT
          );
          const s = scaleT;
          mesh.scale.set(s, s, s);

          if (t >= 1) ud.ready = true;
        } else {
          const tgt = ud.target;
          mesh.position.x = tgt.x + Math.sin(time * 0.5 + i) * 0.08;
          mesh.position.y = tgt.y + Math.cos(time * 0.3 + i) * 0.08;
          mesh.position.z = tgt.z + Math.sin(time * 0.4 + i) * 0.08;
        }

        // Hover interpolation
        ud.hoverProgress = lerp(ud.hoverProgress, ud.targetHover, 0.1);
        mat.uniforms.uHovered.value = ud.hoverProgress;
        mat.uniforms.uTime.value = time;

        const hoverScale = 1 + ud.hoverProgress * 0.3;
        if (ud.ready) {
          mesh.scale.set(hoverScale, hoverScale, hoverScale);
        }

        mesh.lookAt(camera.position);
      });

      controls.update();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // ─── EVENTS ─────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    window.addEventListener('mousemove', (e) => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(meshes);

      if (hits.length > 0) {
        const idx = hits[0].object.userData.index;
        hoveredIndex = idx;
        document.body.style.cursor = 'pointer';
        tooltip.textContent = projects[idx].title;
        tooltip.classList.add('visible');

        meshes.forEach((m, i) => {
          m.userData.targetHover = i === idx ? 1 : 0;
        });
      } else {
        hoveredIndex = null;
        document.body.style.cursor = 'default';
        tooltip.classList.remove('visible');
        meshes.forEach(m => { m.userData.targetHover = 0; });
      }
    });

    window.addEventListener('click', () => {
      if (hoveredIndex !== null) {
        window.location.href = projects[hoveredIndex].projectUrl;
      }
    });
  </script>
</body>
</html>
